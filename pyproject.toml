[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpt-geostat"
version = "0.1.0"
description = "Synthetic CPT dataset generation and spatial diagnostics for geostatistical ground modelling"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "gstools>=1.5",
    "pykrige>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cpt-geostat = "cpt_geostat.cli:main"

[tool.setuptools.packages.find]
include = ["cpt_geostat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

# Synthetic CPT dataset — single source of truth.
#
# Azimuths are DEGREES CLOCKWISE FROM NORTH (0 = north/+y, 90 = east/+x).
# The same convention applies to trend directions, anisotropy angles and channel
# orientations; see cpt_geostat/geometry.py.
#
# Lengths are kilometres laterally and metres vertically. Coordinates have their
# origin at the site centre. `property.mu`, `trend.grad`, `grf.sill`, `nugget`
# and `within_unit.sd` are all in log(Qtn) units.

seed: 20260728

site:
  size_km: 15.0
  raster_res_km: 0.1
  max_depth_m: 50.0

layout:
  grid_n: 11              # 11 x 11 = 121 nominal CPTs
  margin_km: 0.7
  jitter_km: 0.35
  cluster:                # short-lag pairs, without which nugget and range
    n: 4                  # trade off freely near the variogram origin
    centre_km: [2.0, -1.5]
    spread_km: 0.06
  drop_corner:            # data-sparse region for the sensitivity sweep
    enabled: true
    corner: NE
    radius_km: 4.0
    keep_fraction: 0.3

sampling:
  dz_m: 0.02              # real CPT spacing
  min_thickness_m: 1.0    # below this the unit is marked absent, not kept as a sliver

# Stratigraphic order: shallowest first.
units:

  unit_1:
    name: Upper marine sand
    colour: "#E9C46A"
    purpose: "GP == simple kriging identity test: no trend, isotropic"
    presence: {mode: everywhere}
    thickness: {mean_m: 4.0, sd_m: 1.2, range_km: 4.0, min_m: 1.5, max_m: 8.0}
    property:
      mu: 1.55
      trend: {grad: 0.0, azimuth_deg: 0.0}
      grf: {sill: 0.10, range_km: 3.0, aniso_ratio: 1.0, aniso_angle_deg: 0.0, model: matern25}
      nugget: 0.005
      within_unit: {sd: 0.15, corr_len_m: 0.4, drift_per_m: 0.0}

  unit_2:
    name: Glaciomarine clay
    colour: "#F4A261"
    purpose: "Trend handling only: strong oblique trend, isotropic GRF"
    presence: {mode: everywhere}
    thickness: {mean_m: 10.0, sd_m: 3.0, range_km: 5.0, min_m: 2.0, max_m: 18.0}
    property:
      mu: 1.05
      trend: {grad: 0.10, azimuth_deg: 115.0}
      grf: {sill: 0.08, range_km: 3.0, aniso_ratio: 1.0, aniso_angle_deg: 0.0, model: matern25}
      nugget: 0.005
      within_unit: {sd: 0.16, corr_len_m: 0.5, drift_per_m: 0.01}

  unit_3:
    name: Channel sand (upper)
    colour: "#E76F51"
    purpose: "Anisotropy only: no trend, ratio 4 on an oblique axis"
    presence:
      mode: channel
      width_km: 4.5
      sinuosity: 0.35
      wavelength_km: 12.0
      azimuth_deg: 70.0
      offset_km: 0.0
      phase_deg: 20.0
      edge_softness: 0.30
      ragged_range_km: 1.5
    thickness: {mean_m: 6.0, sd_m: 2.0, range_km: 4.0, min_m: 1.0, max_m: 11.0}
    property:
      mu: 1.90
      trend: {grad: 0.0, azimuth_deg: 0.0}
      grf: {sill: 0.09, range_km: 4.0, aniso_ratio: 4.0, aniso_angle_deg: 70.0, model: matern25}
      nugget: 0.006
      within_unit: {sd: 0.20, corr_len_m: 0.3, drift_per_m: 0.0}

  unit_4:
    name: Glacial till
    colour: "#2A9D8F"
    purpose: "Trend and anisotropy together, on different azimuths (confounding)"
    presence: {mode: patch, coverage: 0.45, range_km: 3.0, edge_softness: 0.25}
    thickness: {mean_m: 9.0, sd_m: 2.8, range_km: 4.5, min_m: 1.5, max_m: 16.0}
    property:
      mu: 2.10
      trend: {grad: 0.06, azimuth_deg: 25.0}
      grf: {sill: 0.10, range_km: 3.5, aniso_ratio: 3.0, aniso_angle_deg: 135.0, model: matern25}
      nugget: 0.008
      within_unit: {sd: 0.18, corr_len_m: 0.4, drift_per_m: 0.0}

  unit_5:
    name: Channel sand (lower)
    colour: "#264653"
    purpose: "Sparse, narrow channel with a short range — near data-limited"
    presence:
      mode: channel
      width_km: 2.2
      sinuosity: 0.55
      wavelength_km: 9.0
      azimuth_deg: 25.0
      offset_km: -1.5
      phase_deg: 200.0
      edge_softness: 0.35
      ragged_range_km: 1.0
    thickness: {mean_m: 5.0, sd_m: 1.8, range_km: 3.0, min_m: 1.0, max_m: 10.0}
    property:
      mu: 1.75
      trend: {grad: 0.025, azimuth_deg: 200.0}
      grf: {sill: 0.07, range_km: 1.5, aniso_ratio: 1.0, aniso_angle_deg: 0.0, model: matern25}
      nugget: 0.006
      within_unit: {sd: 0.22, corr_len_m: 0.3, drift_per_m: 0.0}

  unit_6:
    name: Lower cohesive unit
    colour: "#8D6E63"
    purpose: "Noise-dominated failure case: nugget larger than the sill"
    presence: {mode: patch, coverage: 0.30, range_km: 3.5, edge_softness: 0.25}
    thickness: {mean_m: 18.0, sd_m: 5.0, range_km: 5.0, min_m: 3.0, max_m: 32.0}
    property:
      mu: 2.35
      trend: {grad: 0.0, azimuth_deg: 0.0}
      grf: {sill: 0.05, range_km: 3.0, aniso_ratio: 1.0, aniso_angle_deg: 0.0, model: matern25}
      nugget: 0.06
      within_unit: {sd: 0.25, corr_len_m: 0.4, drift_per_m: 0.0}

# Fence / section transects. Endpoints in km.
sections:
  - name: along_channel_3
    p0_km: [-6.95, -2.53]
    p1_km: [6.95, 2.53]
    corridor_km: 1.2
  - name: across_channel_3
    p0_km: [-2.39, 6.58]
    p1_km: [2.39, -6.58]
    corridor_km: 1.2
  - name: west_east
    p0_km: [-7.0, 0.0]
    p1_km: [7.0, 0.0]
    corridor_km: 1.0
